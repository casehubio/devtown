name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Checkout casehub-pages (sibling)
        uses: actions/checkout@v4
        with:
          repository: casehubio/casehub-pages
          path: .sibling-pages

      - name: Checkout blocks-ui (sibling)
        uses: actions/checkout@v4
        with:
          repository: casehubio/blocks-ui
          path: .sibling-blocks-ui

      - name: Symlink siblings
        run: |
          ln -s "$GITHUB_WORKSPACE/.sibling-pages" ../pages
          ln -s "$GITHUB_WORKSPACE/.sibling-blocks-ui" ../../blocks-ui

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'

      - name: Build pages packages
        working-directory: .sibling-pages
        run: |
          corepack enable
          yarn install
          yarn build
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

      - name: Build frontend
        working-directory: app/src/main/webui
        run: npm install && npm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
