name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Stub frontend for Quinoa
        run: |
          mkdir -p app/src/main/webui/dist app/src/main/webui/node_modules
          echo '<html><body>CI stub</body></html>' > app/src/main/webui/dist/index.html

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy -Dmaven.test.skip=true -Dquarkus.quinoa.package-manager-install=false -Dquarkus.quinoa.force-install=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
