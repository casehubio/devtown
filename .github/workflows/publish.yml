name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'

      - name: Build frontend
        working-directory: app/src/main/webui
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const unpublished = ['@casehubio/blocks-ui-session-workbench'];
            for (const [name, ver] of Object.entries(pkg.dependencies || {})) {
              if (unpublished.includes(name)) { delete pkg.dependencies[name]; continue; }
              if (ver.startsWith('file:')) pkg.dependencies[name] = '*';
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            for (const name of unpublished) {
              const dir = 'node_modules/' + name;
              fs.mkdirSync(dir, { recursive: true });
              fs.writeFileSync(dir + '/package.json', JSON.stringify({ name, main: 'index.js' }));
              fs.writeFileSync(dir + '/index.js', '');
            }
          "
          npm install && npm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
