aliases:
  reasoning-heavy:
    chain:
      - tier: FLAGSHIP
        capabilities: [reasoning]
      - backendKey: ollama
      - backendKey: simulation
  standard-review:
    chain:
      - tier: STANDARD
      - backendKey: ollama
      - backendKey: simulation
  cheap-fast:
    chain:
      - tier: FAST
        max-cost: LOW
      - tier: FAST
      - backendKey: ollama
      - backendKey: simulation
defaults:
  backend: ollama
