providers:
  - vendor: anthropic
    credential: env:ANTHROPIC_API_KEY
  - vendor: google-vertex
    credential: env:GOOGLE_APPLICATION_CREDENTIALS
  - vendor: ollama

aliases:
  reasoning-heavy:
    chain:
      - backend-key: claude
      - backend-key: ollama
      - backend-key: simulation
  standard-review:
    chain:
      - backend-key: ollama
      - backend-key: claude
      - backend-key: simulation
  cheap-fast:
    chain:
      - backend-key: ollama
      - backend-key: simulation

defaults:
  backend: claude
