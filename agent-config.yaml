providers:
  - vendor: anthropic
    credential: env:ANTHROPIC_API_KEY
  - vendor: google-vertex
    credential: env:GOOGLE_APPLICATION_CREDENTIALS
aliases:
  reasoning-heavy:
    chain:
      - tier: FLAGSHIP
        capabilities: [reasoning]
      - backendKey: simulation
  standard-review:
    chain:
      - tier: STANDARD
      - backendKey: simulation
  cheap-fast:
    chain:
      - tier: FAST
        maxCost: LOW
      - backendKey: simulation
defaults:
  backend: gemini
