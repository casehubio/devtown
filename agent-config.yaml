providers:
  - vendor: google-vertex
    credential: env:GOOGLE_APPLICATION_CREDENTIALS
  - vendor: anthropic
    credential: env:ANTHROPIC_API_KEY
aliases:
  reasoning-heavy:
    tier: FLAGSHIP
    capabilities: [reasoning]
  standard-review:
    tier: STANDARD
  cheap-fast:
    tier: FAST
    max-cost: LOW
defaults:
  backend: gemini
