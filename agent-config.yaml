providers:
  - vendor: anthropic
    credential: env:ANTHROPIC_API_KEY
  - vendor: google-vertex
    credential: env:GOOGLE_APPLICATION_CREDENTIALS
  - vendor: ollama

aliases:
  reasoning-heavy:
    chain:
      - tier: FLAGSHIP
        capabilities: [reasoning]
        prefer-vendor: anthropic
      - tier: FLAGSHIP
        capabilities: [reasoning]
      - backend-key: simulation
  standard-review:
    chain:
      - tier: STANDARD
      - tier: FAST
      - backend-key: simulation
  cheap-fast:
    chain:
      - tier: FAST
        max-cost: LOW
      - tier: FAST
      - backend-key: simulation

defaults:
  backend: simulation
