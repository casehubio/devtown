<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevTown Scenario Runner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
  .header { padding: 24px 32px; border-bottom: 1px solid #1e293b; }
  .header h1 { font-size: 20px; font-weight: 600; color: #f8fafc; }
  .header p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
  .container { display: flex; height: calc(100vh - 80px); }
  .outline { width: 320px; border-right: 1px solid #1e293b; padding: 16px; overflow-y: auto; }
  .main { flex: 1; padding: 24px 32px; overflow-y: auto; }
  .phase { margin-bottom: 16px; }
  .phase-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; padding: 4px 8px; }
  .step { padding: 8px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; transition: background 0.15s; }
  .step:hover { background: #1e293b; }
  .step.current { background: #1e3a5f; color: #93c5fd; font-weight: 500; }
  .step.done { color: #6ee7b7; }
  .step.done .icon::before { content: "\2713"; }
  .step.current .icon::before { content: "\25CF"; }
  .step.pending .icon::before { content: "\25CB"; }
  .icon { width: 16px; text-align: center; flex-shrink: 0; font-size: 12px; }
  .transport { padding: 16px; border-top: 1px solid #1e293b; display: flex; gap: 8px; align-items: center; }
  .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; }
  .btn-primary { background: #2563eb; color: white; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  .btn-secondary { background: #334155; color: #e2e8f0; }
  .btn-secondary:hover { background: #475569; }
  .btn-reset { background: #7c2d12; color: #fbbf24; }
  .btn-reset:hover { background: #9a3412; }
  .progress { font-size: 12px; color: #64748b; margin-left: auto; }
  .narrative { background: #1e293b; border-radius: 8px; padding: 16px; margin-bottom: 16px; font-size: 14px; line-height: 1.6; }
  .result { background: #0c1524; border: 1px solid #1e293b; border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; font-family: "JetBrains Mono", monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
  .result.ok { border-color: #065f46; }
  .result.fail { border-color: #7c2d12; }
  .result-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #64748b; margin-bottom: 4px; }
  .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .status-badge.ok { background: #065f46; color: #6ee7b7; }
  .status-badge.fail { background: #7c2d12; color: #fca5a5; }
  .empty { color: #475569; font-style: italic; padding: 32px; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <h1>DevTown Scenario Runner</h1>
  <p>PR Review Lifecycle — 11 steps across 7 phases</p>
</div>
<div class="container">
  <div class="outline" id="outline">
    <div class="empty">Click Start to begin</div>
  </div>
  <div class="main" id="main">
    <div class="empty">Waiting for scenario to start...</div>
  </div>
</div>
<div class="transport">
  <button class="btn btn-primary" id="startBtn" onclick="startScenario()">Start Demo</button>
  <button class="btn btn-primary" id="stepBtn" onclick="stepScenario()" disabled>Step</button>
  <button class="btn btn-secondary" id="autoBtn" onclick="autoRun()" disabled>Auto Run</button>
  <button class="btn btn-reset" id="resetBtn" onclick="resetScenario()">Reset</button>
  <span class="progress" id="progress">0/11</span>
</div>

<script>
const BASE = window.location.origin;
let autoRunning = false;

async function post(path) {
  const r = await fetch(`${BASE}/scenario${path}`, { method: 'POST' });
  return r.json();
}

async function get(path) {
  const r = await fetch(`${BASE}/scenario${path}`);
  return r.json();
}

function renderOutline(state) {
  const el = document.getElementById('outline');
  if (!state.outline || state.outline.length === 0) {
    el.innerHTML = '<div class="empty">No scenario loaded</div>';
    return;
  }
  let html = '';
  for (const phase of state.outline) {
    html += `<div class="phase"><div class="phase-label">${phase.label}</div>`;
    for (const step of (phase.children || [])) {
      const cls = step.status === 'done' ? 'done' : step.status === 'current' ? 'current' : 'pending';
      html += `<div class="step ${cls}"><span class="icon"></span>${step.label}</div>`;
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

function renderMain(state) {
  const el = document.getElementById('main');
  if (!state.history || state.history.length === 0) {
    if (state.content && state.content.markdown) {
      el.innerHTML = `<div class="narrative">${state.content.markdown}</div>`;
    }
    return;
  }
  let html = '';
  for (const h of state.history) {
    const result = h.result || {};
    const rs = JSON.stringify(result, null, 2);
    const hasError = rs.includes('"failed"') || rs.includes('"no_pending"') || rs.includes('"error"');
    const badge = hasError ? '<span class="status-badge fail">ISSUE</span>' : '<span class="status-badge ok">OK</span>';
    html += `<div class="result-label">${h.phase} ${badge}</div>`;
    html += `<div class="result ${hasError ? 'fail' : 'ok'}">${h.label}\n${rs}</div>`;
  }
  if (state.content && state.content.markdown) {
    html += `<div class="narrative">${state.content.markdown}</div>`;
  }
  if (state.currentStep >= state.totalSteps) {
    html += '<div class="narrative" style="text-align:center;color:#6ee7b7;font-weight:600;">Scenario Complete</div>';
  }
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

function updateUI(state) {
  renderOutline(state);
  renderMain(state);
  document.getElementById('progress').textContent = `${state.currentStep}/${state.totalSteps}`;
  document.getElementById('stepBtn').disabled = state.currentStep >= state.totalSteps;
  document.getElementById('autoBtn').disabled = state.currentStep >= state.totalSteps;
}

async function startScenario() {
  const state = await post('/start');
  updateUI(state);
  document.getElementById('stepBtn').disabled = false;
  document.getElementById('autoBtn').disabled = false;
}

async function stepScenario() {
  document.getElementById('stepBtn').disabled = true;
  const state = await post('/step');
  updateUI(state);
}

async function autoRun() {
  if (autoRunning) { autoRunning = false; return; }
  autoRunning = true;
  document.getElementById('autoBtn').textContent = 'Stop';
  while (autoRunning) {
    const state = await post('/step');
    updateUI(state);
    if (state.currentStep >= state.totalSteps) break;
    await new Promise(r => setTimeout(r, 2000));
  }
  autoRunning = false;
  document.getElementById('autoBtn').textContent = 'Auto Run';
}

async function resetScenario() {
  autoRunning = false;
  const state = await post('/reset');
  updateUI(state);
}

get('/state').then(updateUI).catch(() => {});
</script>
</body>
</html>
